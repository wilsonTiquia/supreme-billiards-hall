# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# These session-cookie attributes REQUIRE TLS terminated in front of the app (a reverse
# proxy or platform router — the app itself speaks HTTP). No hosting provider is assumed
# here; name none. Local development runs the default profile on plain HTTP, where Secure
# is not set, so leaving these out of application.properties keeps dev working.

# Not sent over plain HTTP; only sent to the TLS-terminating proxy.
server.servlet.session.cookie.secure=true
# Strict: the session cookie is never sent on a cross-site request, which closes the CSRF
# vector on the multipart upload endpoints without a token. Same-origin XHR from the SPA is
# same-site, so the SPA is unaffected.
server.servlet.session.cookie.same-site=strict
# Explicit rather than relying on the container default.
server.servlet.session.cookie.http-only=true

# TLS and the real client address terminate at the proxy, so honour the forwarded headers it
# sets. Standard Spring, no provider specifics. Needed for per-address login lockout to see
# the real client and for Secure cookies to be recognised behind the proxy.
server.forward-headers-strategy=framework

# The datasource (URL, username, password) is read from the environment in every profile —
# see the ${DB_*} placeholders in application.properties. In production those environment
# variables MUST be set to the real values; do not rely on the local-dev defaults, and do
# not commit production credentials to any properties file.
