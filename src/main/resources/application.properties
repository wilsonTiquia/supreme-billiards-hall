spring.application.name=billiards-hall-system

#Database Connection
# From the environment, with local-dev defaults after the colon. No production secret is
# committed: production sets DB_URL / DB_USERNAME / DB_PASSWORD in the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supreme}
spring.datasource.username=${DB_USERNAME:supreme}
spring.datasource.password=${DB_PASSWORD:supreme}

# validate, never update: the Flyway migrations are the schema, and this is what proves the
# entities still agree with them on every start.
spring.jpa.hibernate.ddl-auto=validate
# Keeps JDBC from applying the JVM zone to timestamptz, which would move the business-day boundary.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# One shape for every timestamp on the wire. Without this, values generated in the JVM
# serialise as +08:00 while values read back from Postgres serialise as Z.
spring.jackson.time-zone=UTC

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Payment confirmation photos. Kept indefinitely, admin-only to read.
# Outside the project directory on purpose: this is business evidence, not build output, and
# macOS does not let scheduled jobs (the nightly backup) read anything under ~/Desktop.
supreme.payment-photo.path=${user.home}/SupremeData/payment-photos

# Product images for the POS grid. Same volume and the same reasoning as payment photos, but a
# separate folder: these are catalogue assets, replaceable, and readable by anyone on shift.
supreme.product-image.path=${user.home}/SupremeData/product-images

# The ceiling on an API request body. Nothing else imposes one: the multipart limits below
# bound uploads only, and Tomcat's form-post limit never applies because this API is JSON.
# /api/v1/auth/login is reachable without a session and deserializes before it authenticates,
# so without this an anonymous caller decides how much heap a request costs. Generous next to
# the largest thing the SPA sends, which is a quick sale of a few dozen lines.
supreme.request.max-body-bytes=262144

# Above the 2 MB the image route enforces, so an oversized upload is rejected by the service
# with a message naming the limit rather than by the container with a stack trace. The default
# is 1 MB, which a phone photo clears without trying.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=6MB
